name: Playwright Tests & Allure Report
on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ./capstone/package-lock.json

      - name: Install Dependencies
        working-directory: ./capstone
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./capstone
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        working-directory: ./capstone
        run: npm run test:ci -- --shard=${{ matrix.shard_index }}/3
        continue-on-error: true

      # DIAGNOSTIC CHECK 1: See if individual test runner container builds data
      - name: Debug Generated Shard Results
        working-directory: ./capstone
        run: |
          echo "=== Checking allure-results contents on Shard ${{ matrix.shard_index }} ==="
          ls -la allure-results || echo "allure-results folder does not exist!"

      - name: Upload Allure Raw Results (Shard)
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: allure-results-shard-${{ matrix.shard_index }}
          path: ./capstone/allure-results/
          if-no-files-found: warn
          retention-days: 14

  report:
    if: always()
    needs: [test]
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ./capstone/package-lock.json

      - name: Install Dependencies
        working-directory: ./capstone
        run: npm ci

      - name: Download Allure Raw Results
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: allure-results-shard-*
          merge-multiple: true
          path: ./capstone/allure-results

      # DIAGNOSTIC CHECK 2: See if the combined files exist before building report
      - name: Verify Downloaded Result Files
        run: |
          echo "=== Listing files in combined allure-results folder ==="
          ls -la ./capstone/allure-results || echo "Directory missing!"

      - name: Ensure Allure Results Directory
        run: mkdir -p ./capstone/allure-results

      - name: Generate Allure Report
        working-directory: ./capstone
        run: npm run allure:generate
        continue-on-error: true

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: allure-report
          path: ./capstone/allure-report/
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./capstone/allure-report
        continue-on-error: true
