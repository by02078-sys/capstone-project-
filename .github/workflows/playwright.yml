name: Playwright Tests & Allure Report
on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "24"
          cache: npm
          # Updated to reference the capstone project path
          cache-dependency-path: ./capstone/package-lock.json

      - name: Install Dependencies
        working-directory: ./capstone
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./capstone
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        working-directory: ./capstone
        run: npm run test:ci -- --shard=${{ matrix.shard_index }}/3
        continue-on-error: true

      - name: Upload Allure Raw Results (Shard)
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: allure-results-shard-${{ matrix.shard_index }}
          path: ./capstone/allure-results/
          if-no-files-found: warn
          retention-days: 14

  report:
    if: always()
    needs: [test]
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ./capstone/package-lock.json

      - name: Install Dependencies
        working-directory: ./capstone
        run: npm ci

      - name: Download Allure Raw Results
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: allure-results-shard-*
          merge-multiple: true
          # Downloads artifacts directly to the absolute repository workspace root context
          path: ./capstone/allure-results

      # DEBUG STEP: This lists files so you can verify exactly where things are written if it fails
      - name: Verify Result Structure
        run: |
          echo "=== Checking Capstone Directory ==="
          ls -la ./capstone
          echo "=== Checking Raw Shard Results ==="
          ls -la ./capstone/allure-results || echo "No results directory found"

      - name: Generate Allure Report
        working-directory: ./capstone
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: allure-report
          # Root-relative tracking target pointing straight into your subfolder execution build
          path: ./capstone/allure-report/
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./capstone/allure-report
        continue-on-error: true
