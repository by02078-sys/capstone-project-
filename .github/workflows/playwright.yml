name: Playwright Tests & Allure Report
on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3]

    # FIX 1: Directs test execution steps to look inside the subfolder
    defaults:
      run:
        working-directory: ./capday_6

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ./capday_6/package-lock.json # FIX 2: Finds your lockfile for caching

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npm run test:ci -- --shard=${{ matrix.shard_index }}/3
        continue-on-error: true

      - name: Upload Allure Raw Results (Shard)
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: allure-results-shard-${{ matrix.shard_index }}
          path: ./capday_6/allure-results/ # FIX 3: Points to the subfolder's results directory
          if-no-files-found: warn
          retention-days: 14

  report:
    if: always()
    needs: [test]
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # FIX 4: Directs report processing steps to work inside the subfolder
    defaults:
      run:
        working-directory: ./capday_6

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ./capday_6/package-lock.json # FIX 5: Finds lockfile for report job dependencies

      - name: Install Dependencies
        run: npm ci

      - name: Download Allure Raw Results
        uses: actions/download-artifact@v4.1.8
        with:
          pattern: allure-results-shard-*
          merge-multiple: true
          path: ./capday_6/allure-results # FIX 6: Places downloaded shards directly back into subfolder

      - name: Ensure Allure Results Directory
        run: mkdir -p allure-results

      - name: Generate Allure Report
        run: npm run allure:generate
        continue-on-error: true

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: allure-report
          path: ./capday_6/allure-report/ # FIX 7: Grabs the built HTML files from the correct path
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./capday_6/allure-report # FIX 8: References the correct subfolder deployment path
        continue-on-error: true
