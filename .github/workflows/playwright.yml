name: Playwright Tests CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Playwright Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Install Playwright browsers and system dependencies
      run: npx playwright install --with-deps

    - name: Run tests with sharding
      run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

    - name: Upload allure-results artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-${{ matrix.shardIndex }}
        path: allure-results/
        retention-days: 2

  merge-and-deploy:
    name: Merge Results & Deploy
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Create allure-results directory
      run: mkdir -p allure-results

    - name: Download all allure-results artifacts
      uses: actions/download-artifact@v4
      with:
        path: temp-results/
        pattern: allure-results-*
        merge-multiple: true

    - name: Copy downloaded results to allure-results
      run: |
        if [ -d "temp-results" ]; then
          cp -r temp-results/* allure-results/ || true
        fi
        ls -la allure-results/

    - name: Generate Allure Report
      run: |
        npm run allure:generate

    - name: Prepare Deployment Directory
      run: |
        mkdir -p dist
        cp server.js dist/
        cp package.json dist/
        cp package-lock.json dist/ || true
        cp -r public dist/
        cp -r allure-report dist/

    - name: Deploy to allure-report branch
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd dist
        git init
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Deploy Allure report and dashboard server"
        git push --force https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:allure-report