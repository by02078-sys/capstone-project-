name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Clear Node 20 deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # FIX 1: Forces all run steps below to execute inside your specific subfolder
    defaults:
      run:
        working-directory: ./capstone

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "24"
          # FIX 2: Explicitly points the cache manager to the subfolder's lockfile
          cache: npm
          cache-dependency-path: ./capstone/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4.4.3
        with:
          name: playwright-report
          # FIX 3: Tells the uploader to fetch the report folder from inside the subfolder
          path: ./capstone/playwright-report/
          retention-days: 30
